<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SELFIE 2.0 (סלפי החדש) – מערכת מיפוי ורפלקציה טכנו-פדגוגית ו-AI מזווגת | אורנים – פריזמה</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
      min-height: 100vh;
    }
    @keyframes selfieErrorPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55); transform: scale(1); }
      50% { box-shadow: 0 0 0 12px rgba(225, 29, 72, 0.15); transform: scale(1.01); }
    }
    .selfie-missing-focus {
      animation: selfieErrorPulse 1.1s ease-in-out 3;
    }
    @media print {
      header, nav, #top-live-summary, #selfie-toast, footer {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
  <!-- Toast Notification -->
  <div id="selfie-toast"
    class="fixed bottom-5 left-5 z-50 hidden opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold border border-indigo-400/30">
  </div>

  <!-- Integrated Page Title Card (Inside the page, not an outer dark frame) -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">
    <div class="bg-gradient-to-l from-indigo-50 via-white to-sky-50 rounded-2xl border border-indigo-200/80 shadow-sm p-5 sm:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="text-xs font-bold text-indigo-700">
          מכללת אורנים • תוכנית פריזמה
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mt-0.5">
          שאלון סלפי – מיפוי ורפלקציה טכנו-פדגוגית ובינה מלאכותית
        </h1>
      </div>

      <div class="flex flex-wrap items-center gap-2 self-start md:self-center">
        <nav id="main-tabs-nav" class="flex items-center gap-2"></nav>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5" id="main-view-container"></main>

  <!-- Footer -->
  <footer class="max-w-7xl mx-auto px-4 sm:px-6 py-8 border-t border-slate-200/80 mt-8 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
    <div>
      <strong>סלפי החדש</strong> • מכללת אורנים – תוכנית פריזמה • ד״ר איל בלן והיחידה לקידום הוראה וחדשנות
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data/questions.js"></script>
  <script src="data/demo_cohort.js"></script>
  <script src="js/scoring_engine.js"></script>
  <script src="js/ai_advisor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
